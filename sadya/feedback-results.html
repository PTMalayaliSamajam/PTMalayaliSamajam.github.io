<!doctype html>
<html lang="en" data-event="sadya2026">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sadya Feedback Results · PTMS</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f4d2b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fbf6ea; --paper: #fffdf7; --gold: #c9a13b; --gold-soft: #f1e3b8;
    --leaf: #1f4d2b; --leaf-2: #2f6b3d; --ink: #2a2418; --muted: #6f6551;
    --line: #e6dcc3; --danger: #a3341f; --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--cream); color: var(--ink); font-family: "Manrope", system-ui, sans-serif; font-size: 15px; line-height: 1.5; }
  .top { background: var(--leaf); color: #fff8e6; padding: 14px 16px; border-bottom: 5px solid var(--gold); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .top h1 { font-family: "Fraunces", serif; font-size: 19px; margin: 0; }
  .top .who { font-size: 13px; opacity: .9; display: flex; gap: 10px; align-items: center; }
  .top button { background: transparent; color: #fff8e6; border: 1px solid rgba(255,248,230,.5); border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 48px; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-top: 16px; }
  .card h2 { font-family: "Fraunces", serif; font-size: 18px; margin: 0 0 10px; color: var(--leaf); }
  label { display: block; font-weight: 600; font-size: 14px; margin: 12px 0 5px; }
  input { width: 100%; font: inherit; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--line); background: #fff; }
  .btn { display: inline-block; font: inherit; font-weight: 700; padding: 11px 16px; border-radius: 10px; border: 0; cursor: pointer; background: var(--leaf); color: #fff8e6; }
  .btn.block { display: block; width: 100%; margin-top: 16px; }
  .btn.ghost { background: transparent; color: var(--leaf); border: 1.5px solid var(--leaf); }
  .msg { border-radius: 10px; padding: 11px 13px; font-size: 14px; margin-top: 12px; }
  .msg.err { background: #fbeae5; color: var(--danger); border: 1px solid #efc6ba; }
  .hidden { display: none !important; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .kpi { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .kpi .v { font-family: "Fraunces", serif; font-size: 26px; font-weight: 700; color: var(--leaf); }
  .kpi .l { font-size: 12.5px; color: var(--muted); }

  .bar { display: grid; grid-template-columns: 170px 1fr 48px; gap: 10px; align-items: center; margin: 9px 0; font-size: 14px; }
  .bar .track { height: 12px; background: #f1ead6; border-radius: 99px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--gold); border-radius: 99px; }
  .bar .n { font-weight: 700; text-align: right; }
  @media (max-width: 520px) { .bar { grid-template-columns: 110px 1fr 40px; font-size: 13px; } }

  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .toolbar input { flex: 1; min-width: 160px; }
  .item { border-top: 1px solid var(--line); padding: 12px 0; }
  .item:first-of-type { border-top: 0; }
  .item .h { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 14px; }
  .item .h b { color: var(--leaf); }
  .item .stars { color: var(--gold); letter-spacing: 1px; }
  .item .meta { color: var(--muted); font-size: 12.5px; }
  .item p { margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; }
  .item p .k { font-weight: 700; color: var(--muted); font-size: 12.5px; text-transform: uppercase; letter-spacing: .4px; margin-right: 6px; }
  .tag { display: inline-block; font-size: 12px; border-radius: 99px; padding: 1px 8px; background: var(--gold-soft); color: var(--leaf); font-weight: 700; margin-left: 6px; }
  .empty { color: var(--muted); text-align: center; padding: 18px 0; }
</style>
</head>
<body>

<div class="top">
  <h1>Sadya feedback</h1>
  <div class="who"><span id="whoName"></span><button id="signOut" class="hidden" type="button">Sign out</button></div>
</div>

<main class="wrap">

  <section id="loginCard" class="card hidden">
    <h2>Volunteer sign in</h2>
    <form id="loginForm">
      <label for="lEmail">Email</label>
      <input id="lEmail" type="email" autocomplete="username" required>
      <label for="lPass">Password</label>
      <input id="lPass" type="password" autocomplete="current-password" required>
      <div id="loginMsg" class="msg err hidden"></div>
      <button class="btn block" type="submit" id="loginBtn">Sign in</button>
    </form>
  </section>

  <div id="app" class="hidden">
    <section class="card">
      <div class="kpis">
        <div class="kpi"><div class="v" id="kCount">0</div><div class="l">Responses</div></div>
        <div class="kpi"><div class="v" id="kOverall">–</div><div class="l">Overall (out of 5)</div></div>
        <div class="kpi"><div class="v" id="kAgain">–</div><div class="l">Would join next year</div></div>
      </div>
    </section>

    <section class="card">
      <h2>Average ratings</h2>
      <div id="bars"></div>
    </section>

    <section class="card">
      <h2>Next year?</h2>
      <div id="againBars"></div>
    </section>

    <section class="card">
      <h2>Comments</h2>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search flat, name or comment">
        <button id="csvBtn" class="btn ghost" type="button">Download CSV</button>
      </div>
      <div id="list"></div>
    </section>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app-check.js";
import { firebaseConfig, APP_CHECK_SITE_KEY } from "/sadya/firebase-config.js";

const app = initializeApp(firebaseConfig);
if (APP_CHECK_SITE_KEY) initializeAppCheck(app, { provider: new ReCaptchaV3Provider(APP_CHECK_SITE_KEY), isTokenAutoRefreshEnabled: true });
const auth = getAuth(app);
const db = getFirestore(app);

const EVENT_ID = document.documentElement.dataset.event || "sadya2026";
const $ = (id) => document.getElementById(id);
const show = (el, on = true) => el.classList.toggle("hidden", !on);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const toDate = (ts) => ts?.toDate ? ts.toDate() : null;
const fmt = (ts) => { const d = toDate(ts); return d ? d.toLocaleString("en-IN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) : ""; };
const QUESTIONS = [["overall", "Overall"], ["food", "Food"], ["serving", "Serving"], ["entry", "Entry & timing"]];

let rows = [];
let unsub = null;

onAuthStateChanged(auth, async (user) => {
  if (unsub) { unsub(); unsub = null; }
  if (!user) { show($("app"), false); show($("loginCard")); show($("signOut"), false); $("whoName").textContent = ""; return; }
  const adm = await getDoc(doc(db, "admins", user.uid)).catch(() => null);
  if (!adm || !adm.exists()) {
    $("loginMsg").textContent = `${user.email} is not set up as a volunteer. Ask the organiser to add your UID (${user.uid}) under admins in Firestore.`;
    show($("loginMsg")); show($("loginCard")); await signOut(auth); return;
  }
  $("whoName").textContent = adm.data().name || user.email;
  show($("signOut")); show($("loginCard"), false); show($("app"));
  unsub = onSnapshot(query(collection(db, "feedback"), where("eventId", "==", EVENT_ID)), (snap) => {
    rows = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (toDate(b.createdAt)?.getTime() || 0) - (toDate(a.createdAt)?.getTime() || 0));
    render();
  }, (err) => {
    console.error(err);
    $("list").innerHTML = `<div class="msg err">Couldn't load feedback (${esc(err.code || err.message)}). Check that the Firestore rules for <b>feedback</b> are deployed.</div>`;
  });
});

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("loginBtn"); btn.disabled = true; show($("loginMsg"), false);
  try { await signInWithEmailAndPassword(auth, $("lEmail").value.trim(), $("lPass").value); }
  catch { $("loginMsg").textContent = "Wrong email or password."; show($("loginMsg")); }
  finally { btn.disabled = false; }
});
$("signOut").addEventListener("click", () => signOut(auth));
$("search").addEventListener("input", renderList);

const avg = (k) => rows.length ? rows.reduce((s, r) => s + (Number(r[k]) || 0), 0) / rows.length : 0;
const stars = (n) => "★".repeat(n) + "☆".repeat(5 - n);

function render() {
  $("kCount").textContent = rows.length;
  $("kOverall").textContent = rows.length ? avg("overall").toFixed(1) : "–";
  const yes = rows.filter((r) => r.again === "yes").length;
  $("kAgain").textContent = rows.length ? Math.round((yes / rows.length) * 100) + "%" : "–";

  $("bars").innerHTML = QUESTIONS.map(([k, label]) => {
    const a = avg(k);
    return `<div class="bar"><span>${label}</span><div class="track"><div class="fill" style="width:${(a / 5) * 100}%"></div></div><span class="n">${rows.length ? a.toFixed(1) : "–"}</span></div>`;
  }).join("");

  $("againBars").innerHTML = [["yes", "Yes"], ["maybe", "Maybe"], ["no", "No"]].map(([v, label]) => {
    const n = rows.filter((r) => r.again === v).length;
    const pct = rows.length ? (n / rows.length) * 100 : 0;
    return `<div class="bar"><span>${label}</span><div class="track"><div class="fill" style="width:${pct}%"></div></div><span class="n">${n}</span></div>`;
  }).join("");

  renderList();
}

function renderList() {
  const q = $("search").value.trim().toLowerCase();
  const list = q ? rows.filter((r) => [r.flat, r.name, r.ref, r.liked, r.improve].join(" ").toLowerCase().includes(q)) : rows;
  if (!list.length) { $("list").innerHTML = `<div class="empty">${rows.length ? "No matches." : "No feedback yet."}</div>`; return; }
  $("list").innerHTML = list.map((r) => `
    <div class="item">
      <div class="h">
        <span><b>Flat ${esc(r.flat)}</b>${r.name ? " · " + esc(r.name) : ""}${r.ref ? ` <span class="meta">(${esc(r.ref)})</span>` : ""}<span class="tag">${esc(r.again || "")}</span></span>
        <span class="meta">${esc(fmt(r.createdAt))}</span>
      </div>
      <div class="meta">Overall <span class="stars">${stars(r.overall || 0)}</span> · Food ${r.food || "–"} · Serving ${r.serving || "–"} · Entry ${r.entry || "–"}</div>
      ${r.liked ? `<p><span class="k">Enjoyed</span>${esc(r.liked)}</p>` : ""}
      ${r.improve ? `<p><span class="k">Improve</span>${esc(r.improve)}</p>` : ""}
    </div>`).join("");
}

$("csvBtn").addEventListener("click", () => {
  const head = ["Submitted", "Flat", "Name", "Ref / mobile", "Overall", "Food", "Serving", "Entry & timing", "Enjoyed", "Improve", "Next year"];
  const body = rows.map((r) => [fmt(r.createdAt), r.flat, r.name, r.ref, r.overall, r.food, r.serving, r.entry, r.liked, r.improve, r.again]);
  const csv = [head, ...body].map((row) => row.map((v) => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));
  a.download = `${EVENT_ID}-feedback-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
});
</script>
</body>
</html>
